<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>واجهة دردشة المشاريع</title>
  <style>
    :root{
      --text:#18304f;
      --muted:#7e8fa8;
      --line:rgba(255,255,255,.38);
      --blue1:#1c63ff;
      --blue2:#4fc3ff;
      --bubble-ai:rgba(255,255,255,.88);
      --bubble-user:linear-gradient(135deg,#1f57e7,#2da3ff);
      --shadow:0 30px 80px rgba(11,34,78,.22);
      --soft:0 12px 30px rgba(55,92,162,.15);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      color:var(--text);
      overflow:hidden;
      background:#dfe8f6;
    }

    .bg-video{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      z-index:-3;
    }

    .bg-overlay{
      position:fixed;
      inset:0;
      z-index:-2;
      background:
        radial-gradient(700px 260px at 15% 10%, rgba(110,182,255,.22), transparent 60%),
        radial-gradient(700px 280px at 85% 90%, rgba(0,123,255,.14), transparent 60%),
        linear-gradient(180deg, rgba(235,242,252,.40), rgba(223,232,246,.62));
      backdrop-filter:blur(3px);
    }

    .stage{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
    }

    .chat-shell{
      position:relative;
      width:min(1180px, calc(100vw - 56px));
      height:min(900px, calc(100vh - 56px));
      border-radius:34px;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.35);
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
      padding:14px;
    }

    .chat-card{
      height:100%;
      border-radius:28px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      border:1px solid rgba(255,255,255,.45);
      background:rgba(255,255,255,.100);
      backdrop-filter:blur(22px);
      box-shadow:0 20px 50px rgba(24,57,120,.16), inset 0 1px 0 rgba(255,255,255,.75);
    }

    .header{
      background:linear-gradient(90deg, rgba(28,99,255,.95), rgba(79,195,255,.92));
      color:#fff;
      padding:18px 20px 16px;
      display:flex;
      align-items:center;
      gap:14px;
      box-shadow:inset 0 -1px 0 rgba(255,255,255,.16);
    }

    .avatar{
      width:58px;height:58px;border-radius:50%;
      background:linear-gradient(145deg,#ffffff,#dfe8ff);
      display:grid;place-items:center;
      color:#2b5dff;font-weight:800;font-size:18px;
      box-shadow:0 8px 22px rgba(0,0,0,.14);
      flex:0 0 auto;
    }

    .head-copy h1{
      margin:0;
      font-size:20px;
      line-height:1.2;
      font-weight:800;
    }

    .head-copy p{
      margin:6px 0 0;
      font-size:13px;
      opacity:.94;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .dot{
      width:12px;height:12px;border-radius:50%;
      background:#48ea48;
      box-shadow:0 0 0 4px rgba(72,234,72,.20);
      display:inline-block;
      flex:0 0 auto;
    }

    .messages{
      flex:1;
      overflow:auto;
      padding:18px 18px 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08)),
        rgba(255,255,255,.10);
      scroll-behavior:smooth;
    }

    .messages::-webkit-scrollbar{width:8px}
    .messages::-webkit-scrollbar-thumb{background:rgba(161,182,220,.7);border-radius:20px}
    .messages::-webkit-scrollbar-track{background:transparent}

    .system-note{
      display:flex;
      align-items:center;
      gap:10px;
      color:#5d6f8c;
      font-size:13px;
      padding:4px 4px 16px;
    }

    .mini-avatar{
      width:30px;height:30px;border-radius:50%;
      background:rgba(238,244,255,.92);
      color:#2b7cff;
      display:grid;place-items:center;
      font-size:12px;font-weight:800;
      border:1px solid #dfe9ff;
      flex:0 0 auto;
      box-shadow:0 6px 16px rgba(39,91,190,.10);
    }

    .row{
      display:flex;
      margin:12px 0;
      align-items:flex-end;
      gap:10px;
      animation:rise .28s ease;
    }

    .row.ai{justify-content:flex-start}
    .row.user{justify-content:flex-end}

    .bubble{
      max-width:min(78%, 760px);
      padding:14px 16px;
      border-radius:20px;
      font-size:15px;
      line-height:1.8;
      box-shadow:var(--soft);
      word-wrap:break-word;
      white-space:pre-wrap;
      position:relative;
    }

    .row.ai .bubble{
      background:var(--bubble-ai);
      border:1px solid rgba(226,234,247,.92);
      color:var(--text);
      border-bottom-right-radius:8px;
      backdrop-filter:blur(10px);
    }

    .row.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-bottom-left-radius:8px;
      box-shadow:0 14px 32px rgba(43,124,255,.28);
    }

    .typing{
      display:flex;
      gap:6px;
      align-items:center;
      min-width:58px;
      padding:14px 16px;
    }

    .typing span{
      width:8px;height:8px;border-radius:50%;
      background:#8fa7d6;
      animation:bounce 1s infinite ease-in-out;
      opacity:.7;
    }

    .typing span:nth-child(2){animation-delay:.15s}
    .typing span:nth-child(3){animation-delay:.3s}

    .action-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:220px;
      padding:12px 16px;
      border-radius:16px;
      text-decoration:none;
      font-size:14px;
      font-weight:700;
      color:#fff;
      background:linear-gradient(135deg,#1f57e7,#2da3ff);
      box-shadow:0 10px 24px rgba(43,124,255,.25);
      transition:.18s ease;
    }

    .action-link:hover{
      transform:translateY(-1px);
    }

    .composer-wrap{
      padding:12px 16px 16px;
      border-top:1px solid rgba(255,255,255,.38);
      background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.30));
      position:relative;
      backdrop-filter:blur(10px);
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:0 2px 12px;
      max-height:86px;
      overflow:auto;
    }

    .chips::-webkit-scrollbar{height:6px;width:6px}
    .chips::-webkit-scrollbar-thumb{background:#d9e2f3;border-radius:99px}

    .chip{
      border:none;
      background:rgba(255,255,255,.72);
      color:#2f4c77;
      padding:10px 13px;
      border-radius:999px;
      font-size:13px;
      cursor:pointer;
      transition:.2s ease;
      box-shadow:inset 0 0 0 1px rgba(214,226,246,.95), 0 6px 16px rgba(56,92,156,.08);
      backdrop-filter:blur(8px);
    }

    .chip:hover{
      transform:translateY(-1px);
      background:#f6faff;
    }

    .suggestions{
      position:absolute;
      left:16px; right:16px;
      bottom:88px;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(230,237,249,.96);
      border-radius:22px;
      box-shadow:0 20px 45px rgba(51,78,128,.16);
      backdrop-filter:blur(14px);
      overflow:hidden;
      display:none;
      max-height:240px;
    }

    .suggestion{
      width:100%;
      text-align:right;
      border:none;
      background:transparent;
      padding:13px 16px;
      cursor:pointer;
      color:#314767;
      font-size:14px;
      border-bottom:1px solid #f0f4fb;
      transition:.18s ease;
    }

    .suggestion:last-child{border-bottom:none}

    .suggestion:hover{
      background:#f5f9ff;
      color:#1d58e7;
    }

    .composer{
      display:flex;
      align-items:center;
      gap:10px;
      background:rgba(245,248,253,.78);
      border-radius:20px;
      padding:10px 10px 10px 14px;
      box-shadow:inset 0 0 0 1px rgba(232,238,248,.95);
      backdrop-filter:blur(10px);
    }

    .composer input{
      flex:1;
      border:none;
      outline:none;
      background:transparent;
      color:var(--text);
      font-size:16px;
      padding:6px 4px;
    }

    .composer input::placeholder{color:#7c90aa}

    .send{
      border:none;
      width:48px;height:48px;
      border-radius:16px;
      background:linear-gradient(135deg,#215be8,#32a0ff);
      color:#fff;
      cursor:pointer;
      font-size:18px;
      box-shadow:0 10px 24px rgba(43,124,255,.28);
      transition:.18s ease;
      flex:0 0 auto;
    }

    .send:hover{transform:translateY(-1px) scale(1.02)}
    .send:active{transform:scale(.98)}

    .footer-note{
      text-align:center;
      color:#5c6f8e;
      font-size:12px;
      padding-top:10px;
      user-select:none;
    }

    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.45}
      40%{transform:translateY(-6px);opacity:1}
    }

    @keyframes rise{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }

    @media (max-width:900px){
      .stage{padding:14px}
      .chat-shell{
        width:calc(100vw - 28px);
        height:calc(100vh - 28px);
        border-radius:26px;
        padding:10px;
      }
      .chat-card{border-radius:22px}
      .bubble{max-width:88%}
    }

    @media (max-width:560px){
      .stage{padding:8px}
      .chat-shell{
        width:calc(100vw - 16px);
        height:calc(100vh - 16px);
        border-radius:22px;
        padding:8px;
      }
      .chat-card{border-radius:18px}
      .header{padding:16px 14px}
      .head-copy h1{font-size:18px}
      .bubble{max-width:90%}
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="2.mp4" type="video/mp4" />
  </video>
  <div class="bg-overlay"></div>

  <div class="stage">
    <div class="chat-shell">
      <div class="chat-card">
        <div class="header">
          <div class="avatar">AI</div>
          <div class="head-copy">
            <h1>كيف نكدر نساعدك؟</h1>
            <p><span class="dot"></span> دردشة الكترونية لمساعدتك على تشغيل مشروعك باسرع وقت ممكن</p>
          </div>
        </div>

        <div class="messages" id="messages">
          <div class="system-note">
            <div class="mini-avatar">AI</div>
            <div>المساعد جاهز الآن</div>
          </div>
        </div>

        <div class="composer-wrap">

          <div class="suggestions" id="suggestions"></div>

          <div class="composer">

            <input id="promptInput" type="text" autocomplete="off" placeholder="اكتب سؤالك هنا" />
          </div>

          <div class="footer-note">HTML Offline Chat</div>
        </div>
      </div>
    </div>
  </div>

<script>

function normalize(s){
  return (s || "")
    .toLowerCase()
    .replace(/[ًٌٍَُِّْـ]/g,'')
    .replace(/[أإآ]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/ى/g,'ي')
    .replace(/[^\w\u0600-\u06FF\s-]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function tokenize(s){
  return normalize(s).split(' ').filter(Boolean);
}

function containsAny(text, list){
  return list.some(item => text.includes(normalize(item)));
}

function scoreEntry(query, entry){
  const q = normalize(query);
  if(!q) return 0;
  const pool = normalize(entry.q + " " + (entry.aliases||[]).join(" ") + " " + entry.a);

  let score = 0;
  if (normalize(entry.q).includes(q)) score += 120;
  if ((entry.aliases||[]).some(a => normalize(a).includes(q))) score += 80;
  if (pool.includes(q)) score += 35;

  const queryWords = tokenize(q);
  const poolWords = new Set(tokenize(pool));
  queryWords.forEach(w => {
    if (poolWords.has(w)) score += 14;
    if (w.length > 2 && pool.includes(w)) score += 6;
  });

  return score;
}

function getMatches(query, limit=8){
  const scored = KB
    .map(entry => ({entry, score: scoreEntry(query, entry)}))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score);

  const unique = [];
  const used = new Set();
  for(const item of scored){
    if(used.has(item.entry.q)) continue;
    used.add(item.entry.q);
    unique.push(item.entry);
    if(unique.length >= limit) break;
  }
  return unique;
}

    return {
      text: "أنا مساعد بسيط داخل الصفحة، أساعدك بأسئلة التشغيل والفحص وبعض الأسئلة العامة المرتبطة بالمشروع.",
      suggestions: ["شلون يشتغل المشروع؟","شنو الـ IP مال الواجهة؟","التواصل مع الصفحة"]
    };
  }

  if (containsAny(q, ["باي","مع السلامه","مع السلامة","اشوفك","نشوفك"])) {
    return {
      text: "بالتوفيق.",
      suggestions: ["التواصل مع الصفحة","شلون أستخدم RUN.bat؟"]
    };
  }

  return null;
}

function getKBAnswer(query){
  const matches = getMatches(query, 5);
  if(matches.length){
    const best = matches[0];
    if(scoreEntry(query, best) >= 24){
      const result = {
        text: best.a,
        suggestions: matches.slice(1,4).map(x => x.q)
      };

      if(normalize(best.q) === normalize("التواصل مع الصفحة")){
        result.action = { label: "فتح صفحة Instagram", url: INSTAGRAM_URL };
      }

      return result;
    }
  }

  return {
    text: "ما لقيت جواب مباشر بنفس الصياغة، لكن أقدر أفهم سؤالك إذا كتبته بشكل أبسط أو تختار واحد من الاقتراحات الأقرب.",
    suggestions: ["شلون يشتغل المشروع؟","شنو الـ IP مال الواجهة؟","التواصل مع الصفحة","شلون أفحص المشروع بسرعة؟"]
  };
}

function getAnswer(query){
  return getSmallTalk(query) || getKBAnswer(query);
}

function saveHistory(){
  localStorage.setItem('offline_project_chat_history', messages.innerHTML);
}

function restoreHistory(){
  const saved = localStorage.getItem('offline_project_chat_history');
  if(saved){
    messages.innerHTML = saved;
    scrollBottom(false);
  }else{
    addMessage("ai","اكتب سؤالك.");
  }
}

function scrollBottom(smooth=true){
  messages.scrollTo({top: messages.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});
}

function rowTemplate(role, html){
  const row = document.createElement('div');
  row.className = `row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'mini-avatar';
  avatar.textContent = role === 'ai' ? 'AI' : 'أنت';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html || "";

  if(role === 'ai'){
    row.appendChild(avatar);
    row.appendChild(bubble);
  }else{
    row.appendChild(bubble);
    row.appendChild(avatar);
  }
  return {row, bubble};
}

function addMessage(role, text){
  const {row, bubble} = rowTemplate(role, "");
  messages.appendChild(row);

  if(role === 'ai'){
    typeInto(bubble, text, 10);
  }else{
    bubble.textContent = text;
  }

  scrollBottom();
  setTimeout(saveHistory, 80);
}

function addActionBubble(label, url){
  const {row, bubble} = rowTemplate("ai", "");
  bubble.innerHTML = `<a class="action-link" href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  messages.appendChild(row);
  scrollBottom();
  setTimeout(saveHistory, 80);
}

function typeInto(el, text, speed=12){
  let i = 0;
  const content = text || "";
  const timer = setInterval(() => {
    el.textContent = content.slice(0, i + 1);
    i++;
    scrollBottom();
    if(i >= content.length){
      clearInterval(timer);
      saveHistory();
    }
  }, speed);
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';

  const avatar = document.createElement('div');
  avatar.className = 'mini-avatar';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  messages.appendChild(row);
  scrollBottom();
}

function hideTyping(){
  const old = document.getElementById('typingRow');
  if(old) old.remove();
}

function renderQuickChips(list = frequent){
  quickChips.innerHTML = "";
  list.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = text;
    btn.onclick = () => {
      input.value = text;
      updateSuggestions();
      sendMessage();
    };
    quickChips.appendChild(btn);
  });
}

function renderSuggestions(list){
  suggestionsBox.innerHTML = "";
  if(!list.length){
    suggestionsBox.style.display = "none";
    return;
  }
  list.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'suggestion';
    btn.textContent = text;
    btn.onclick = () => {
      input.value = text;
      suggestionsBox.style.display = "none";
      sendMessage();
    };
    suggestionsBox.appendChild(btn);
  });
  suggestionsBox.style.display = "block";
}

function updateSuggestions(){
  const q = input.value.trim();
  if(!q){
    renderSuggestions(frequent);
    return;
  }

  const matches = getMatches(q, 8).map(x => x.q);

  if (containsAny(q, ["تواصل","انستا","انستغرام","instagram"]) && !matches.includes("التواصل مع الصفحة")) {
    matches.unshift("التواصل مع الصفحة");
  }

  if (containsAny(q, ["هلو","هلا","مرحبا","سلام"]) && !matches.includes("هلو")) {
    matches.unshift("هلو");
  }

  if (containsAny(q, ["اشلونك","شلونك","كيف حالك"]) && !matches.includes("اشلونك")) {
    matches.unshift("اشلونك");
  }

  renderSuggestions(matches.slice(0,8));
}

function sendMessage(){
  const q = input.value.trim();
  if(!q) return;

  suggestionsBox.style.display = "none";
  addMessage("user", q);
  input.value = "";

  const answer = getAnswer(q);
  showTyping();

  setTimeout(() => {
    hideTyping();
    addMessage("ai", answer.text);

    if(answer.action){
      setTimeout(() => {
        addActionBubble(answer.action.label, answer.action.url);
      }, 220);
    }

    if(answer.suggestions && answer.suggestions.length){
      renderQuickChips(answer.suggestions);
    }else{
      renderQuickChips(frequent);
    }
  }, 480);
}

sendBtn.addEventListener('click', sendMessage);

input.addEventListener('input', updateSuggestions);
input.addEventListener('focus', updateSuggestions);

input.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    sendMessage();
  }
});

document.addEventListener('click', e => {
  if(!suggestionsBox.contains(e.target) && e.target !== input){
    suggestionsBox.style.display = "none";
  }
});

restoreHistory();
renderQuickChips();
</script>
</body>
</html>
